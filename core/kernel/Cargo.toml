[package]
name = "panhub_kernel"
version = "0.1.0"
edition = "2021"
publish = false
description = "PanHub 的 Rust 原生内核：大文件哈希、分片校验、编码工具"

[lib]
name = "panhub_kernel"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.22", default-features = false }
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
crc32fast = "1.5"
hex = "0.4"
base64 = "0.22"
thiserror = "2.0"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
log = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
