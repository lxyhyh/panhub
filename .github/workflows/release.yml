# 云端出包：单独一个工作流，跑 assembleRelease 并把 APK / AAB 作为 artifact 发出来。
# 与 build.yml 分工：那边管质量门（单测 + 内核 + debug 组装），这边只管给用户产出可安装的包。
# 手动触发（workflow_dispatch），可选填版本号，默认从 gradle.properties 里读。
name: release

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "写入 APK 的版本名（留空则用仓库里的默认值）"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/kernel/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/kernel/Cargo.lock', 'core/kernel/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      - name: Cross-compile for Android
        working-directory: core/kernel
        # runner 预置了 ANDROID_NDK_HOME，cargo-ndk 自动读取，这里不要转发一次。
        run: |
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o src/main/jniLibs \
            build --release

      - name: Upload native libs
        uses: actions/upload-artifact@v4
        with:
          name: release-kernel-jnilibs
          path: core/kernel/src/main/jniLibs
          if-no-files-found: error

  apk:
    runs-on: ubuntu-latest
    needs: [ kernel ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform 37.2
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.2" "build-tools;37.0.0"

      - name: Download native libs
        uses: actions/download-artifact@v4
        with:
          name: release-kernel-jnilibs
          path: core/kernel/src/main/jniLibs

      - name: Stamp version name
        if: ${{ github.event.inputs.versionName != '' }}
        run: |
          sed -i "s/^versionName=.*/versionName=${{ github.event.inputs.versionName }}/" app/build.gradle.kts
          grep -n "versionName" app/build.gradle.kts

      # runner 上不存在 debug.keystore（它只在开发者本机首次构建时生成）。
      # release 用 debug 密钥签名，所以先在 AGP 期望的路径生成一个。
      - name: Generate signing keystore
        run: |
          mkdir -p "$HOME/.config/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Assemble release APK
        run: ./gradlew --stacktrace :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: panhub-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error