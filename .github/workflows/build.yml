name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 只构建手机上真正会装的 ABI，避免 APK 体积翻倍。
  RUST_TARGETS: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

jobs:
  # 先跑纯 JVM 的单元测试：这些模块不需要 Android SDK，
  # 跑得快，能在烧钱的 Android 构建之前就发现问题。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: JVM unit tests
        run: |
          ./gradlew --stacktrace \
            :core:model:test \
            :core:common:test \
            :core:network:test \
            :provider:api:test \
            :provider:webdav:test \
            :provider:pan123:test \
            :provider:lanzou:test \
            :provider:cloud189:test \
            :provider:quark:test \
            :provider:baidu:test \
            :core:storage:test \
            :core:transfer:test \
            :core:session:test

  # Rust 内核单独一个 job：它只在改了 core/kernel 时才需要重编，
  # 缓存命中率高，而且失败原因一眼能看清是 C 还是 Kotlin 的问题。
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/kernel/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/kernel/Cargo.lock', 'core/kernel/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Host unit tests
        working-directory: core/kernel
        run: cargo test --all-targets

      - name: Clippy
        working-directory: core/kernel
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      - name: Cross-compile for Android
        working-directory: core/kernel
        # runner 预置了 ANDROID_NDK_HOME 与 ANDROID_NDK_LATEST_HOME，cargo-ndk 会自动读取，
        # 这里不要再转发一次（自引用会把它覆盖成空值）。
        run: |
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o src/main/jniLibs \
            build --release

      - name: Upload native libs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-jnilibs
          path: core/kernel/src/main/jniLibs
          if-no-files-found: error

  # 组装 APK。depends on kernel，这样 .so 一定会先就位。
  android:
    runs-on: ubuntu-latest
    needs: [ test, kernel ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # compileSdk 是 37.2（Compose BOM 2026.11.01 与 core-ktx 1.19 的要求），
      # runner 镜像里通常只有整数版平台，次版本要自己装。
      - name: Install Android platform 37.2
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.2" "build-tools;37.0.0"

      - name: Download native libs
        uses: actions/download-artifact@v4
        with:
          name: kernel-jnilibs
          path: core/kernel/src/main/jniLibs

      - name: Assemble debug APK
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: panhub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error